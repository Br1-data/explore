name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/funny-allen-d6a9za]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the browser client
        run: npm run build -w @segnale/client
        env:
          # Optional: Pages runs the local game when no online server is configured.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
